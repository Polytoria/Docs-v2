Name: Physical
Description: Physical represents an object affected by physics in the world.
Category: physics
BaseType: Dynamic
Properties:
  - Name: Anchored
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether this object is affected by physics.
  - Name: CanCollide
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether this object can collide with other objects.
  - Name: CollisionLayers
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines what collision layers this object belongs to.
  - Name: CollisionMask
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines what collision layers this object can collide with.
  - Name: Velocity
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the linear velocity of this object.
  - Name: AngularVelocity
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the angular velocity of this object.
  - Name: RayPassthrough
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Methods:
  - Name: SetNetworkAuthority
    Returns: []
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: plr
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sets the network authority of this object to the specified player.
  - Name: SetCollisionLayer
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: layer
        DefaultValue: null
      - Type:
          Name: boolean
          IsOptional: false
        Name: value
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: SetCollisionMask
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: layer
        DefaultValue: null
      - Type:
          Name: boolean
          IsOptional: false
        Name: value
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: GetCollisionLayer
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: layer
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: GetCollisionMask
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: layer
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: GetTouching
    Returns:
      - ElementType:
          Name: Physical
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get all objects that are currently in contact with this object.
  - Name: MovePosition
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: position
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Moves the part by the specified vector while keeping physics in mind.
  - Name: MoveRotation
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: rotation
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Rotates the part by the specified Euler angles while keeping
      physics in mind.
  - Name: AddForce
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: force
        DefaultValue: null
      - Type:
          Name: ForceMode
          IsOptional: true
        Name: mode
        DefaultValue: Force
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Add force to this physical
  - Name: AddTorque
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: force
        DefaultValue: null
      - Type:
          Name: ForceMode
          IsOptional: true
        Name: mode
        DefaultValue: Force
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Add torque to this physical
  - Name: AddForceAtPosition
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: force
        DefaultValue: null
      - Type:
          Name: Vector3
          IsOptional: false
        Name: position
        DefaultValue: null
      - Type:
          Name: ForceMode
          IsOptional: true
        Name: mode
        DefaultValue: Force
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Add force at position to this physical
  - Name: AddRelativeForce
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: force
        DefaultValue: null
      - Type:
          Name: ForceMode
          IsOptional: true
        Name: mode
        DefaultValue: Force
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Add relative force to this physical
  - Name: AddRelativeTorque
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: torque
        DefaultValue: null
      - Type:
          Name: ForceMode
          IsOptional: true
        Name: mode
        DefaultValue: Force
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Add relative torque to this physical
Events:
  - Name: Touched
    Parameters:
      - Type:
          Name: Physical
          IsOptional: false
        Name: hit
        DefaultValue: null
    Description: Fires when this object has collide with other object
  - Name: TouchEnded
    Parameters:
      - Type:
          Name: Physical
          IsOptional: false
        Name: hit
        DefaultValue: null
    Description: Fires when this object has stopped colliding with other object
  - Name: MouseEnter
    Parameters: []
    Description: Fires when cursor is hovered on this object. Only fired locally
  - Name: MouseExit
    Parameters: []
    Description: Fires when cursor leaves this object. Only fired locally
  - Name: Clicked
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
    Description: Fires when this object has been clicked by a player
IsStatic: false
IsAbstract: true
IsInstantiable: false
StaticAlias: null
