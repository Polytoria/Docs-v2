Name: AddonObject
Description: AddonObject represents an addon in the creator. This object serves
  as the main interface for addon developers to interact with the addon system.
Category: addons
BaseType: null
Properties:
  - Name: Identifier
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The identifier for this addon.
  - Name: AddonName
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The display name of the addon. This name will appear in the tools menu.
  - Name: AddonIcon
    Type:
      Name: PTImageAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the addon icon.
Methods:
  - Name: RequestPermissions
    Returns: []
    Parameters:
      - Type:
          ElementType:
            Name: AddonPermission
            IsOptional: false
          Name: Array
          IsOptional: false
        Name: perms
        DefaultValue: null
    IsAsync: true
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Prompt the user to request for permissions
  - Name: CreateToolItem
    Returns:
      - Name: AddonToolItem
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: txt
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Create a new tool item with text.
Events:
  - Name: CleanupReceived
    Parameters: []
    Description: Fires when cleanup has been requested by the creator, this is
      usually fired when updating the addon.
IsStatic: false
IsAbstract: false
IsInstantiable: false
StaticAlias: null
