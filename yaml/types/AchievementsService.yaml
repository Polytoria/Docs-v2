Name: AchievementsService
Description: Service for managing achievements
Category: services
BaseType: Instance
Properties:
  - Name: UseAchievementSound
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if the achievement sound effect should play when user
      receives an achievement
  - Name: NotifyAchievements
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if achievement toast should show when user receives an
      achievement
Methods:
  - Name: AwardAsync
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: userID
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: achievementID
        DefaultValue: null
    IsAsync: true
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Award achievement to the target user asynchronously.
  - Name: HasAchievementAsync
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: userID
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: achievementID
        DefaultValue: null
    IsAsync: true
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Check if the target user has the achievement, asynchronously.
Events:
  - Name: GotAchievement
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: achievementID
        DefaultValue: null
    Description: Fires when the local player got an achievement
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Achievements
