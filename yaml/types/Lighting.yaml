Name: Lighting
Description: Lighting is responsible for controlling the state of the lighting
  in the place. It provides many different options for creators to enhance and
  fine-tune the visuals of their worlds.
Category: game
BaseType: Instance
Properties:
  - Name: Skybox
    Type:
      Name: SkyboxPreset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Sets the skybox to one of the preset skyboxes.
  - Name: AmbientSource
    Type:
      Name: AmbientSource
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the source of ambient lighting in the place.
  - Name: AmbientColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Sets the ambient color of the lighting in the place.
  - Name: FogEnabled
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Enables or disables fog in the place.
  - Name: FogColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Sets the color of the fog in the place.
  - Name: FogStartDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Sets the distance from the camera at which fog begins to appear.
  - Name: FogEndDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Sets the distance from the camera at which fog stops appearing.
Methods: []
Events: []
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Lighting
