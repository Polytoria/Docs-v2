Name: Marker3D
Description: Marker3D is a object that allows marking a specific point in world.
  This will hint an axis gizmo in local test and creator.
Category: world
BaseType: Dynamic
Properties:
  - Name: Length
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Length of this Marker
  - Name: AppearOnTop
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if this marker should appear on top of everything else in 3D.
  - Name: VisibleInDev
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if this marker should be visible in development.
Methods:
  - Name: New
    Returns:
      - Name: Marker3D
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
