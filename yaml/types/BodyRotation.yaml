Name: BodyRotation
Description: BodyRotation are objects that apply a force to their parent until
  they reach the target rotation.
Category: physics
BaseType: Instance
Properties:
  - Name: TargetRotation
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the target rotation that the body applies forces to get to.
  - Name: Force
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines how much force the body applies.
  - Name: AcceptanceAngle
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines how close the body has to be to the target rotation to
      stop applying forces to it.
Methods:
  - Name: SetQuaternion
    Returns: []
    Parameters:
      - Type:
          Name: Quaternion
          IsOptional: false
        Name: quaternion
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sets target rotation to the given quaternion.
  - Name: New
    Returns:
      - Name: BodyRotation
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
