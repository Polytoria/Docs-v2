Name: NetworkEvent
Description: NetworkEvents are events that can be called to communicate between
  server and client. NetMessages are the class used for sharing data between
  server and client when sending NetworkEvents.
Category: networking
BaseType: Instance
Properties:
  - Name: Reliable
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if this network event should send messages reliably.
      Recommended to be off if you're passing lot of data that doesn't need to
      arrive reliably.
Methods:
  - Name: InvokeServer
    Returns: []
    Parameters:
      - Type:
          Name: NetMessage
          IsOptional: true
        Name: msg
        DefaultValue: null
      - Type:
          Name: any
          IsOptional: true
        Name: _
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sends a message to the server.
  - Name: InvokeClient
    Returns: []
    Parameters:
      - Type:
          Name: NetMessage
          IsOptional: true
        Name: msg
        DefaultValue: null
      - Type:
          Name: Player
          IsOptional: true
        Name: player
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sends a message to a specific client.
  - Name: InvokeClients
    Returns: []
    Parameters:
      - Type:
          Name: NetMessage
          IsOptional: true
        Name: msg
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sends a message to all connected clients.
  - Name: New
    Returns:
      - Name: NetworkEvent
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: InvokedServer
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: sender
        DefaultValue: null
      - Type:
          Name: NetMessage
          IsOptional: false
        Name: msg
        DefaultValue: null
    Description: Fires when server receives message from client
  - Name: InvokedClient
    Parameters:
      - Type:
          Name: NetMessage
          IsOptional: false
        Name: msg
        DefaultValue: null
    Description: Fires when client receives message from server
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
