  - Name: New
    Returns:
      - Name: Dynamic
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
