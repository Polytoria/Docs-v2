    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: point
        DefaultValue: null
      - Type:
          Name: Vector3
          IsOptional: false
        Name: axis
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: angle
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Rotates the object around a point and axis by the specified angle.
  - Name: Rotate
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: eulerAngles
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Rotates the object by the specified Euler angles.
  - Name: GetBounds
    Returns:
