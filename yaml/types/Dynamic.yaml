Name: Dynamic
Description: Dynamic is the base class where all objects with a position,
  rotation and scale derive from.
Category: world
BaseType: Instance
Properties:
  - Name: Position
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The position of the object.
  - Name: Rotation
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The rotation of the object.
  - Name: Size
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The size of the object.
  - Name: LocalPosition
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The position of the object relative to its parent.
  - Name: LocalRotation
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The rotation of the object relative to its parent.
  - Name: LocalSize
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The size of the object relative to its parent.
  - Name: Quaternion
    Type:
      Name: Quaternion
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The rotation of the object represented as a quaternion.
  - Name: LocalQuaternion
    Type:
      Name: Quaternion
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The local rotation of the object represented as a quaternion.
  - Name: Locked
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the object can be selected in the Creator.
  - Name: Forward
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The forward direction vector of the object.
  - Name: Right
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The right direction vector of the object.
  - Name: Up
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The up direction vector of the object.
Methods:
  - Name: LookAt
    Returns: []
    Parameters:
      - Type:
          Name: any
          IsOptional: false
        Name: target
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Orients the object to look at a target with a specified up vector.
  - Name: LookAt
    Returns: []
    Parameters:
      - Type:
          Name: any
          IsOptional: false
        Name: target
        DefaultValue: null
      - Type:
          Name: Vector3
          IsOptional: false
        Name: up
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Orients the object to look at a target with a specified up vector.
  - Name: Translate
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: translation
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
