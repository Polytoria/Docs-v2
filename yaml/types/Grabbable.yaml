Name: Grabbable
Description: Grabbable represents a object that can be dragged by user. It can
  be parented to Physical to give user ability to drag that object.
Category: physics
BaseType: Instance
Properties:
  - Name: Force
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the force used to drag this object.
  - Name: MaxRange
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines how far this object can be dragged.
  - Name: MaxGrabbableRange
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the max range that this object can be grabbed from.
  - Name: UseDragForce
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if dragging this object should affect physics.
  - Name: PermissionMode
    Type:
      Name: GrabbablePermissionMode
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the permission mode for this grabber
  - Name: Dragger
    Type:
      Name: Player
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns the current dragger
  - Name: PermissionPredicate
    Type:
      Parameters:
        - Type:
            ElementType:
              Name: any
              IsOptional: false
            Name: Tuple
            IsOptional: false
          Name: null
          DefaultValue: null
      Returns:
        - ElementType:
            Name: any
            IsOptional: false
          Name: Tuple
          IsOptional: false
      Name: function
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: >-
      A predicate function deciding whether this player can grab this object.
      `PermissionMode` must be set to `GrabbablePermissionMode.Scripted`


      Example usage:

      ```lua

      grabbable.PermissionMode = Enums.GrabbablePermissionMode.Scripted

      grabbable.PermissionPredicate = function(player)
        return player.Name == "Player1"
      end

      ```
Methods:
  - Name: New
    Returns:
      - Name: Grabbable
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: Grabbed
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: grabber
        DefaultValue: null
    Description: Fires when this object has been grabbed
  - Name: Released
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: grabber
        DefaultValue: null
    Description: Fires when this object has been released
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
