Name: NetworkedObject
Description: NetworkedObject is a base class for all object that's synchronized
  by the network.
Category: networking
BaseType: null
Properties:
  - Name: Name
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Name of this object
  - Name: ClassName
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Class name of this object
  - Name: Shared
    Type:
      Name: ScriptSharedTable
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: A shared table accessible by scripts.
  - Name: NetworkedObjectID
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns networked ID of this object. Networked ID are always unique
      per network session.
  - Name: ObjectID
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns object ID of this object. Object ID originates from the .poly file.
  - Name: ExistInNetwork
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns true if this object exists in network, false if this object
      is spawned by the local client.
Methods:
  - Name: IsA
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns whether or not the instance is the specified class, this
      also checks for inheritance.
  - Name: Clone
    Returns:
      - Name: NetworkedObject
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Clones the instance
  - Name: Destroy
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: true
        Name: time
        DefaultValue: "0"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Destroys the instance (same as Delete method)
  - Name: Delete
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: true
        Name: time
        DefaultValue: "0"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Deletes the instance (same as Destroy method)
Events:
  - Name: PropertyChanged
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: propertyName
        DefaultValue: null
    Description: Fires when a property of this object has changed
  - Name: Renamed
    Parameters: []
    Description: Fires when this object has been renamed
  - Name: TreeEntered
    Parameters: []
    Description: Fires when object enters the tree
  - Name: TreeExited
    Parameters: []
    Description: Fires when object exit the tree (via reparent or delete)
  - Name: Destroying
    Parameters: []
    Description: Fires when this object is being destroyed
IsStatic: false
IsAbstract: true
IsInstantiable: false
StaticAlias: null
