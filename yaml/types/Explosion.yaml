Name: Explosion
Description: Explosion is a deadly explosion killing players and applying force
  to parts at the given position.
Category: effects
BaseType: Dynamic
Properties:
  - Name: Radius
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the radius of this explosion
  - Name: Force
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the force of this explosion that will be applied to
      affected hits
  - Name: AffectAnchored
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if this explosion should affect anchored parts or not
  - Name: Damage
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Damage that is applied to the player
  - Name: AffectWelds
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if welds are broken by this explosion
  - Name: UseEffects
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: AffectPredicate
    Type:
      Parameters:
        - Type:
            ElementType:
              Name: any
              IsOptional: false
            Name: Tuple
            IsOptional: false
          Name: null
          DefaultValue: null
      Returns:
        - ElementType:
            Name: any
            IsOptional: false
          Name: Tuple
          IsOptional: false
      Name: function
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: |-
      A predicate function deciding whether this part should be accepted or not
          
      Example usage:
      ```lua
      explosion.AffectPredicate = function(hit)
        -- always explode
        return true
      end
      ```
Methods:
  - Name: New
    Returns:
      - Name: Explosion
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: Touched
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: hit
        DefaultValue: null
    Description: Fires when this explosion affects an instance
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
