Name: Tool
Description: Tools are objects that can be held by the player.
Category: world
BaseType: RigidBody
Properties:
  - Name: Droppable
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the tool can be dropped by the player.
  - Name: IconImage
    Type:
      Name: ImageAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The icon for this tool, appears in inventory.
  - Name: DropEquipCooldown
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the cooldown before a dropped tool can be picked up.
  - Name: Holder
    Type:
      Name: NPC
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines who is currently holding this tool.
Methods:
  - Name: Activate
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Activates the tool, similarly to pressing the mouse button.
  - Name: Deactivate
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Deactivates the tool, similarly to releasing the mouse button.
  - Name: PlayAnimation
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: animationName
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Plays the specified animation on the holder of the tool.
  - Name: New
    Returns:
      - Name: Tool
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: Equipped
    Parameters: []
    Description: Fires when this tool has been equipped
  - Name: Unequipped
    Parameters: []
    Description: Fires when this tool has been unequipped
  - Name: Activated
    Parameters: []
    Description: Fires when this tool has been activated (via mouse press or
      `Tool:Activate`)
  - Name: Deactivated
    Parameters: []
    Description: Fires when this tool has been deactivated (via mouse release or
      `Tool:Deactivate`)
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
