Name: Script
Description: Scripts are abstract base classes representing Lua code that can be
  executed in the game.
Category: scripting
BaseType: Instance
Properties:
  - Name: Source
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The source code of the script as a string.
  - Name: IsEnabled
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if this script should be enabled. Note that setting it to
      false during runtime won't stop the script immediately, rather it would
      stop any running threads when it hits any yield function.
  - Name: LinkedScript
    Type:
      Name: FileLinkAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: A linked script asset associated with this script.
  - Name: Compatibility
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the script is running in compatibility mode.
Methods:
  - Name: Call
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: funcName
        DefaultValue: null
      - Type:
          ElementType:
            Name: any
            IsOptional: false
          Name: Tuple
          IsOptional: false
        Name: args
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Calls a function in the script with the given arguments.
  - Name: CallAsync
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: funcName
        DefaultValue: null
      - Type:
          ElementType:
            Name: any
            IsOptional: false
          Name: Tuple
          IsOptional: false
        Name: args
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Calls a function in the script asynchronously with the given arguments.
  - Name: LinkWithScriptFile
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: scriptPath
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Link script with the target file path
Events: []
IsStatic: false
IsAbstract: true
IsInstantiable: false
StaticAlias: null
