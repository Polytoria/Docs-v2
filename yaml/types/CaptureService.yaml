Name: CaptureService
Description: Service for capturing photos
Category: services
BaseType: Instance
Properties:
  - Name: OnCooldown
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns whether the capture is on cooldown.
  - Name: CanCapture
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if user/scripts can take a picture.
  - Name: DefaultCaptureOverlay
    Type:
      Name: UIField
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Default capture overlay for all captures
  - Name: SpectatorAttach
    Type:
      Name: Dynamic
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Attaches a spectator camera at dynamic for use with spectator mode.
Methods:
  - Name: TakePhotoAtDynamic
    Returns: []
    Parameters:
      - Type:
          Name: Dynamic
          IsOptional: false
        Name: dyn
        DefaultValue: null
      - Type:
          Name: Vector2
          IsOptional: true
        Name: photoSize
        DefaultValue: null
      - Type:
          Name: UIField
          IsOptional: true
        Name: overlay
        DefaultValue: null
    IsAsync: true
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Take a photo at dynamic
  - Name: TakePhotoAt
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
      - Type:
          Name: Vector3
          IsOptional: false
        Name: rot
        DefaultValue: null
      - Type:
          Name: Vector2
          IsOptional: true
        Name: photoSize
        DefaultValue: null
      - Type:
          Name: UIField
          IsOptional: true
        Name: overlay
        DefaultValue: null
    IsAsync: true
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Take photo at `pos` for position and `rot` for rotation, optional
      `photoSize` defines the size, and optional UI `overlay` can be passed to
      include it in the result photo.
Events: []
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Capture
