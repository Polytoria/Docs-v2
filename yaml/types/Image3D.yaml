Name: Image3D
Description: Image3D are objects that can have an image texture and are placed in the world.
Category: world
BaseType: Dynamic
Properties:
  - Name: Image
    Type:
      Name: ImageAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Specifies the image of the Image3D.
  - Name: TextureScale
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The scale of the texture on the Image3D.
  - Name: TextureOffset
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The offset of the texture on the Image3D.
  - Name: Color
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the color of the Image3D.
  - Name: CastShadows
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the Image3D should cast shadows.
  - Name: Shaded
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the Image3D should be affected by lighting.
  - Name: FaceCamera
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the Image3D should always face the camera.
  - Name: DoubleSided
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the image renders on both sides.
  - Name: TextureFilter
    Type:
      Name: TextureFilter
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the texture filter mode.
Methods:
  - Name: New
    Returns:
      - Name: Image3D
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
