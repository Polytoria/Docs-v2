Name: Instance
Description: Instance is the base class of all classes. Every class derives from
  it and has all properties, events and functions Instance has.
Category: misc
BaseType: NetworkedObject
Properties:
  - Name: Parent
    Type:
      Name: Instance
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Defines the parent of this instance in the hierarchy.
  - Name: EditableChildren
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if children is editable, this is to be used if this
      instance is a Linked model. Only used in creator.
  - Name: Tags
    Type:
      ElementType:
        Name: string
        IsOptional: false
      Name: Array
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Tags associated with this instance.
  - Name: Archivable
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if this instance should be saved during the saving
      process. Useful for addons that wants to create a temporary instance.
Methods:
  - Name: GetDescendants
    Returns:
      - ElementType:
          Name: Instance
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Gets all descendants of this instance.
  - Name: FindChild
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: name
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Finds a child of this instance by name.
  - Name: WaitChild
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: name
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: true
        Name: timeoutSec
        DefaultValue: null
    IsAsync: true
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Wait for children to be added.
  - Name: FindChildByClass
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Finds a child of this instance by class name.
  - Name: FindChildWithTag
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Find first child with the specified tag
  - Name: FindDescendant
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: path
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Finds a descendant of this instance by path.
  - Name: GetChildrenWithTag
    Returns:
      - ElementType:
          Name: Instance
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get children with the specified tag
  - Name: GetDescendantsWithTag
    Returns:
      - ElementType:
          Name: Instance
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get descendants with the specified tag
  - Name: FindAncestorByClass
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Find ancestor by the specified class name
  - Name: FindChildByIndex
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: index
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Find child by its index (index for this function starts from 0)
  - Name: MoveChild
    Returns: []
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: child
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: index
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Move children to specified index (index for this function starts from 0)
  - Name: GetChildren
    Returns:
      - ElementType:
          Name: Instance
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Gets all children of this instance.
  - Name: GetChildrenOfClass
    Returns:
      - ElementType:
          Name: Instance
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Gets all children of this instance that are of the specified class.
  - Name: IsAncestorOf
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: instance
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Determines if this instance is an ancestor of the given instance.
  - Name: IsDescendantOf
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: instance
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Determines if this instance is a descendant of the given instance.
  - Name: IsDescendantOfClass
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Determines if this instance is a descendant of the given class.
  - Name: New
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: className
        DefaultValue: null
      - Type:
          Name: Instance
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Creates a new instance of the specified class.
  - Name: AddTag
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Adds a tag to this instance.
  - Name: RemoveTag
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Removes a tag from this instance.
  - Name: HasTag
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Checks if this instance has the specified tag.
  - Name: Reparent
    Returns: []
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: to
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Reparent this instance to another instance
  - Name: GetParent
    Returns:
      - Name: Instance
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Gets the parent of this instance.
  - Name: SetParent
    Returns: []
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: newParent
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sets the parent of this instance.
Events:
  - Name: ChildAdded
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: child
        DefaultValue: null
    Description: Fires when child has been added to this instance
  - Name: ChildRemoved
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: child
        DefaultValue: null
    Description: Fires when child has been removed from this instance (either via
      reparent or delete)
  - Name: ChildDeleting
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: child
        DefaultValue: null
    Description: Fires when child is being deleted from this instance
  - Name: ChildDeleted
    Parameters:
      - Type:
          Name: Instance
          IsOptional: false
        Name: child
        DefaultValue: null
    Description: Fires when child has been deleted from this instance
  - Name: TagAdded
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    Description: Fires when given a tag.
  - Name: TagRemoved
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: tag
        DefaultValue: null
    Description: Fires when a tag is removed.
IsStatic: false
IsAbstract: true
IsInstantiable: false
StaticAlias: null
