Name: BodyPosition
Description: BodyPosition are objects that apply a force to their parent until
  they reach the target position.
Category: physics
BaseType: Instance
Properties:
  - Name: TargetPosition
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the target position that the body applies forces to get to.
  - Name: Force
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines how much force the body applies.
  - Name: AcceptanceDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines how close the body has to be to the target position to
      stop applying forces to it.
Methods:
  - Name: New
    Returns:
      - Name: BodyPosition
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
