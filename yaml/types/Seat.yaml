Name: Seat
Description: Seats are parts the player can sit on.
Category: world
BaseType: Part
Properties:
  - Name: Occupant
    Type:
      Name: NPC
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates who is currently occupying the seat.
  - Name: CanPlayerSit
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether players are allowed to sit on this seat.
  - Name: CanNPCSit
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether NPCs are allowed to sit on this seat.
  - Name: SitDirectionLocked
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Methods:
  - Name: New
    Returns:
      - Name: Seat
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: Sat
    Parameters:
      - Type:
          Name: NPC
          IsOptional: false
        Name: occupant
        DefaultValue: null
    Description: Fires when an occupant sits on the seat.
  - Name: Vacated
    Parameters:
      - Type:
          Name: NPC
          IsOptional: false
        Name: occupant
        DefaultValue: null
    Description: Fires when an occupant leaves the seat.
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
