Name: CreatorService
Description: CreatorService is the class that manages the creator. This class is
  only available in the creator.
Category: services
BaseType: null
Properties:
  - Name: Interface
    Type:
      Name: CreatorInterface
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: true
    ObsoletionInfo: null
    Description: The interface
  - Name: CurrentGame
    Type:
      Name: World
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: true
