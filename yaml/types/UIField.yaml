Name: UIField
Description: UIField is the abstract base class of all UI classes.
Category: ui
BaseType: Instance
Properties:
  - Name: PositionOffset
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The offset of the UI element in pixels.
  - Name: PositionRelative
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The position of the UI element relative to its parent.
  - Name: Rotation
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The rotation of the UI element in degrees.
  - Name: SizeOffset
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The size offset of the UI element in pixels.
  - Name: SizeRelative
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The size of the UI element relative to its parent.
  - Name: ClipDescendants
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the UI element clips its descendants.
  - Name: PivotPoint
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The pivot point of the UI element.
  - Name: Scale
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The scale of the UI element.
  - Name: Visible
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the UI element is visible.
  - Name: MaskMode
    Type:
      Name: UIMaskMode
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the mask mode of the UI element.
  - Name: IgnoreMouse
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines if the UI field should be ignored by mouse input
  - Name: ZIndex
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the ZIndex value of this UI field.
  - Name: AbsolutePosition
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The absolute position of the UI element in pixels.
  - Name: AbsoluteSize
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The absolute size of the UI element in pixels.
  - Name: IsVisibleInTree
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the UI element is visible in the UI hierarchy.
Methods:
  - Name: New
    Returns:
      - Name: UIField
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: MouseEnter
    Parameters: []
    Description: Fires when user's cursor hovers on this UI
  - Name: MouseExit
    Parameters: []
    Description: Fires when user's cursor leaves this UI
  - Name: MouseDown
    Parameters: []
    Description: Fires when user hold down mouse on this UI
  - Name: MouseUp
    Parameters: []
    Description: Fires when user release mouse on this UI
  - Name: TransformChanged
    Parameters: []
    Description: Fires when this UI transform has been changed
  - Name: VisibilityChanged
    Parameters: []
    Description: Fires when this UI visibility has been changed
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
