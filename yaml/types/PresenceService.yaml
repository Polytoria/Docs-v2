Name: PresenceService
Description: PresenceService is a service that allows ClientScripts to set the
  active status of the player. Which will be used to display in supported
  integrations.
Category: services
BaseType: Instance
Properties:
  - Name: State
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Current activity status.
  - Name: CoverImage
    Type:
      Name: PTImageAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Activity cover image.
Methods:
  - Name: ResetTimer
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Reset the running timer for this activity.
Events: []
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Presence
