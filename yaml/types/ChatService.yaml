Name: ChatService
Description: Chat is a static class used for various actions regarding the chat.
Category: services
BaseType: Instance
Properties:
  - Name: ChatPredicate
    Type:
      Parameters:
        - Type:
            ElementType:
              Name: any
              IsOptional: false
            Name: Tuple
            IsOptional: false
          Name: null
          DefaultValue: null
      Returns:
        - ElementType:
            Name: any
            IsOptional: false
          Name: Tuple
          IsOptional: false
      Name: function
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: >
      A callback function that filters chat messages before they are processed
      by the server, and displayed to other players.

      ```lua

      Chat.ChatPredicate = function(plr: Player, msg: string)
          if msg == "miau" then
              Chat:UnicastMessage("no miau allowed", plr)
              return false
          end
          return true
      end

      ```
Methods:
  - Name: BroadcastMessage
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: msg
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sends a chat message to all players.
  - Name: UnicastMessage
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: msg
        DefaultValue: null
      - Type:
          Name: Player
          IsOptional: false
        Name: plr
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Sends a chat message to a specific player.
Events:
  - Name: NewChatMessage
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: sender
        DefaultValue: null
      - Type:
          Name: string
          IsOptional: false
        Name: message
        DefaultValue: null
    Description: Fires when new chat message has been received from player
  - Name: MessageReceived
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: message
        DefaultValue: null
    Description: Fires when new message has been received from either
      `BroadcastMessage` or `UnicastMessage`
  - Name: MessageDeclined
    Parameters: []
    Description: Fires when message has been declined by the server
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Chat
