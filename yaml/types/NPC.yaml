Name: NPC
Description: NPC (non-player character) is an object similar to a  Player but
  that can be controlled by code. Like players, it can walk and jump, and its
  body part colors can be customized.
Category: world
BaseType: Physical
Properties:
  - Name: Velocity
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the linear velocity of this NPC.
  - Name: SeatOffset
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The offset to the seat at which the NPC is positioned when sitting.
  - Name: Health
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The current health of the NPC.
  - Name: MaxHealth
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The maximum health of the NPC.
  - Name: JumpPower
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the jump power of the NPC.
  - Name: WalkSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the walking speed of the NPC.
  - Name: UseNametag
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the NPC uses a nametag.
  - Name: NametagOffset
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the offset position of the NPC's nametag.
  - Name: NametagVisibleRadius
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the visibility radius of the NPC's nametag.
  - Name: DisplayName
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the display name of the NPC.
  - Name: JumpSound
    Type:
      Name: Sound
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the sound played when the NPC jumps.
  - Name: IsSitting
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the NPC is currently sitting.
  - Name: IsDead
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the NPC is currently dead.
  - Name: HoldingTool
    Type:
      Name: Tool
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the tool currently held by the NPC.
  - Name: SittingIn
    Type:
      Name: Seat
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the seat in which the NPC is currently sitting.
  - Name: Character
    Type:
      Name: CharacterModel
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The character model associated with the NPC.
  - Name: Vertical
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: MoveTarget
    Type:
      Name: Dynamic
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the instance the NPC should walk towards.
  - Name: IsOnGround
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates if NPC is standing on ground.
  - Name: IsOnCeiling
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates if NPC is on the ceiling.
  - Name: NavDestinationDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the distance to the navigation destination.
  - Name: NavDestinationReached
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the NPC has reached its navigation destination.
  - Name: NavDestinationValid
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the navigation destination is valid.
Methods:
  - Name: Move
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: velo
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Move this NPC while respecting collisions.
  - Name: Kill
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Kills the NPC.
  - Name: TryStepUp
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Try to detect stairs and step up. Returns true if the NPC has stepped up.
  - Name: Jump
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Makes the NPC jump.
  - Name: Sit
    Returns: []
    Parameters:
      - Type:
          Name: Seat
          IsOptional: false
        Name: seat
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Makes the NPC sit on a specified seat.
  - Name: Unsit
    Returns: []
    Parameters:
      - Type:
          Name: boolean
          IsOptional: true
        Name: addForce
        DefaultValue: "True"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Unsits the NPC from the current seat.
  - Name: EquipTool
    Returns: []
    Parameters:
      - Type:
          Name: Tool
          IsOptional: false
        Name: tool
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Equips the NPC with a specified tool.
  - Name: DropTool
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Unequips the currently equipped tool from the NPC.
  - Name: LoadAppearance
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: userID
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Loads the appearance of the NPC based on a user ID.
  - Name: ClearAppearance
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Clears the NPC's current appearance.
  - Name: SetNavDestination
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Determines the position the NPC should walk towards.
  - Name: Respawn
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Respawns the NPC.
  - Name: TakeDamage
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: dmg
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Applies damage to the NPC.
  - Name: Heal
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: amount
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Heals the NPC by a specified amount.
  - Name: New
    Returns:
      - Name: NPC
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: Died
    Parameters: []
    Description: Triggered when the NPC dies.
  - Name: HealthChanged
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: newHealth
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: oldHealth
        DefaultValue: null
    Description: Fires when the NPC's health changes.
  - Name: Jumped
    Parameters: []
    Description: Fires when the NPC jumps.
  - Name: LeftGround
    Parameters: []
    Description: Fires when the NPC is no longer on ground.
  - Name: Seated
    Parameters:
      - Type:
          Name: Seat
          IsOptional: false
        Name: seat
        DefaultValue: null
    Description: Fires when the NPC sits on a seat.
  - Name: Unseated
    Parameters:
      - Type:
          Name: Seat
          IsOptional: false
        Name: seat
        DefaultValue: null
    Description: Fires when the NPC exits from a seat.
  - Name: Landed
    Parameters: []
    Description: Triggered when the NPC lands on the ground after a jump or fall.
  - Name: NavFinished
    Parameters: []
    Description: Triggered when the NPC finishes navigating to a destination.
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
