Name: Stat
Description: Stat is an object that represents a player stat to which players
  can be assigned to have their own number or string values.
Category: game
BaseType: Instance
Properties:
  - Name: DisplayName
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The display name for this stat.
  - Name: Visible
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the stat is visible.
Methods:
  - Name: GetDisplayName
    Returns:
      - Name: string
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the display name of the stat. If DisplayName is specified,
      it returns DisplayName; otherwise, it returns Name.
  - Name: Set
    Returns: []
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: val
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Set the value stat of player to string
  - Name: Set
    Returns: []
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
      - Type:
          Name: string
          IsOptional: false
        Name: val
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Set the value stat of player to string
  - Name: Get
    Returns:
      - Name: any
        IsOptional: false
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get the value stat of player
  - Name: GetTotalForTeam
    Returns:
      - Name: number
        IsOptional: false
    Parameters:
      - Type:
          Name: Team
          IsOptional: false
        Name: team
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get the total value for team
  - Name: GetDisplayValue
    Returns:
      - Name: string
        IsOptional: false
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: plr
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Gets the display value for a player. If the value is a number, it
      is automatically converted to K/M/S format (e.g., 1K+, 12.3K+).
  - Name: New
    Returns:
      - Name: Stat
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events: []
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
