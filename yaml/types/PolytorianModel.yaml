Name: PolytorianModel
Description: a PolytorianModel is a CharacterModel that represents the default
  Polytoria Character.
Category: world
BaseType: CharacterModel
Properties:
  - Name: HeadColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The head color
  - Name: TorsoColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The torso color
  - Name: LeftArmColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The left arm color
  - Name: RightArmColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The right arm color
  - Name: LeftLegColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The left leg color
  - Name: RightLegColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The right leg color
  - Name: FaceImage
    Type:
      Name: ImageAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The face image to use
  - Name: BodyMesh
    Type:
      Name: MeshAsset
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The body mesh to use. The mesh must be in Polytoria Body rig format.
  - Name: Ragdolling
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns true if this character is ragdolling.
  - Name: RagdollPosition
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns the current global ragdoll position. If not ragdolling,
      Returns `Vector3.Zero`.
  - Name: RagdollRotation
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns the current global ragdoll rotation. If not ragdolling,
      Returns `Vector3.Zero`.
Methods:
  - Name: StartRagdoll
    Returns: []
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: true
        Name: force
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Start ragdoll
  - Name: StopRagdoll
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Stop ragdoll
  - Name: GetAttachment
    Returns:
      - Name: Dynamic
        IsOptional: false
    Parameters:
      - Type:
          Name: CharacterAttachment
          IsOptional: false
        Name: attachmentEnum
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Get an attachment from this character.
  - Name: LoadAppearance
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: userID
        DefaultValue: null
      - Type:
          Name: boolean
          IsOptional: true
        Name: loadTool
        DefaultValue: "True"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Load an appearance.
  - Name: ClearAppearance
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Clear current appearance.
  - Name: New
    Returns:
      - Name: PolytorianModel
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: RagdollStarted
    Parameters: []
    Description: Fires when ragdoll starts.
  - Name: RagdollStopped
    Parameters: []
    Description: Fires when ragdoll stops.
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
