Name: Player
Description: Player represents a user playing the game.
Category: game
BaseType: NPC
Properties:
  - Name: UserID
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The unique ID of the player.
  - Name: CanMove
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player can move.
  - Name: SprintSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the sprinting speed of the player.
  - Name: Stamina
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the current stamina of the player.
  - Name: MaxStamina
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the maximum stamina of the player.
  - Name: UseStamina
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player uses stamina.
  - Name: StaminaRegen
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the rate at which the player's stamina regenerates.
  - Name: StaminaBurn
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the rate at which the player's stamina depletes while sprinting.
  - Name: RespawnTime
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the time the player has to wait before respawning.
  - Name: KeepInventory
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the inventory is kept when respawning.
  - Name: UseHeadTurning
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player uses head turning.
  - Name: UseBubbleChat
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player uses bubble chat.
  - Name: AutoLoadAppearance
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player's appearance is automatically loaded.
  - Name: AllowAnimationWhileMoving
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: If true, animation will not stop when player starts moving
  - Name: Team
    Type:
      Name: Team
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Player's assigned team
  - Name: MovementMode
    Type:
      Name: PlayerMovementMode
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine the movement mode for the player.
  - Name: RotationMode
    Type:
      Name: PlayerRotationMode
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: Grabbing
    Type:
      Name: Physical
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: NetworkPing
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The amount of network latency (ping) the player is experiencing.
  - Name: IsAdmin
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player is an administrator.
  - Name: IsCreator
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player is the creator of the game.
  - Name: UserRoleClass
    Type:
      Name: string
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Role class of the player.
  - Name: ChatColor
    Type:
      Name: Color
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the chat color of the player.
  - Name: IsLocal
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player is the local player.
  - Name: IsClimbing
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the player is currently climbing.
  - Name: ClimbingTruss
    Type:
      Name: Truss
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the truss the player is currently climbing.
  - Name: UserPlatform
    Type:
      Name: ClientPlatform
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the platform the player is using.
  - Name: Inventory
    Type:
      Name: Inventory
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The inventory of the player.
Methods:
  - Name: Jump
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Makes the player jump.
  - Name: Kick
    Returns: []
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: reason
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Kicks the player from the game with the specified reason.
  - Name: UnequipTool
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Unequips the currently equipped tool of the player.
  - Name: Respawn
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Respawns the player.
  - Name: ResetAppearance
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Resets the player's appearance to the default.
Events:
  - Name: Chatted
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: message
        DefaultValue: null
    Description: Fires when this player chats
  - Name: StatChanged
    Parameters:
      - Type:
          Name: Stat
          IsOptional: false
        Name: stat
        DefaultValue: null
      - Type:
          Name: any
          IsOptional: false
        Name: value
        DefaultValue: null
    Description: Fires when stat value has changed
  - Name: TeamChanged
    Parameters:
      - Type:
          Name: Team
          IsOptional: false
        Name: team
        DefaultValue: null
    Description: Fires when player has been assigned a team
  - Name: Respawned
    Parameters: []
    Description: Fires when this player has respawned
  - Name: Grabbed
    Parameters:
      - Type:
          Name: Physical
          IsOptional: false
        Name: physical
        DefaultValue: null
    Description: Fires when this player has grabbed an object
  - Name: Ungrabbed
    Parameters:
      - Type:
          Name: Physical
          IsOptional: false
        Name: physical
        DefaultValue: null
    Description: Fires when this player has stopped grabbing an object
IsStatic: false
IsAbstract: false
IsInstantiable: false
StaticAlias: null
