Name: Camera
Description: Camera is a class that represents the local player's camera.
Category: game
BaseType: Dynamic
Properties:
  - Name: Forward
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The forward direction vector of the camera.
  - Name: Mode
    Type:
      Name: CameraMode
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines or returns the camera's current mode.
  - Name: FOV
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines or returns the camera's field of view.
  - Name: ClipThroughWalls
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the camera should clip through walls.
  - Name: MinDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The camera's minimum distance from the target in Follow mode.
  - Name: MaxDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines camera's maximum distance from the target in Follow mode.
  - Name: Distance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the distance between the camera and the target when the
      camera is in Follow mode.
  - Name: ScrollSensitivity
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the scroll move speed of the camera.
  - Name: Orthographic
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the camera should render in orthographic
      (2D) mode or not (3D).
  - Name: FollowLerp
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not to use lerping in Follow mode.
  - Name: LerpSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the lerp speed of the camera when lerping is enabled.
  - Name: OrthographicSize
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the half-size of the camera when in orthographic mode.
  - Name: Near
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the minimum distance from the camera for objects to render.
  - Name: Far
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the maximum distance from the camera for objects to render.
  - Name: PositionOffset
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the camera's offset from its position.
  - Name: QuaternionOffset
    Type:
      Name: Quaternion
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
  - Name: RotationOffset
    Type:
      Name: Vector3
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the camera's offset from its rotation.
  - Name: IsFirstPerson
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Returns whether or not the camera is in first person.
  - Name: CanLock
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if camera can be ctrl locked.
  - Name: SensitivityMultiplier
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Multipler for camera sensitivity
  - Name: Sensitivity
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Current sensitivity of the camera
  - Name: HorizontalSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the horizontal movement speed of the camera in Follow mode.
  - Name: VerticalSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the vertical move speed of the camera.
  - Name: ScrollLerpSpeed
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the lerp amount when scrolling
  - Name: CtrlLocked
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if camera is in Ctrl lock mode
  - Name: AlwaysLocked
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determine if camera should always be in locked mode
  - Name: Target
    Type:
      Name: Dynamic
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: The target of Follow mode
Methods:
  - Name: IsPositionInView
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Check if position is in the camera's view.
  - Name: IsPositionBehind
    Returns:
      - Name: boolean
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Check if position is behind the camera's view.
  - Name: ViewportPointToRay
    Returns:
      - Name: RayResult
        IsOptional: true
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
      - Type:
          ElementType:
            Name: Instance
            IsOptional: false
          Name: Array
          IsOptional: true
        Name: ignoreList
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: true
        Name: maxDistance
        DefaultValue: "10000"
      - Type:
          Name: number
          IsOptional: true
        Name: passthroughMask
        DefaultValue: "0"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Cast a ray from the camera at the specified ViewportPoint (Vector2
      with components with values in range of 0 - 1 describing how far a point
      is to the right and to the top of the screen) into the game world
  - Name: ScreenPointToRay
    Returns:
      - Name: RayResult
        IsOptional: true
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
      - Type:
          ElementType:
            Name: Instance
            IsOptional: false
          Name: Array
          IsOptional: true
        Name: ignoreList
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: true
        Name: maxDistance
        DefaultValue: "10000"
      - Type:
          Name: number
          IsOptional: true
        Name: passthroughMask
        DefaultValue: "0"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Cast a ray from the camera at screen point into the game world
  - Name: ViewportToScreenPoint
    Returns:
      - Name: Vector2
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from viewport space into screen space.
  - Name: ViewportToWorldPoint
    Returns:
      - Name: Vector3
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from viewport space into world space.
  - Name: WorldToViewportPoint
    Returns:
      - Name: Vector2
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from world space into viewport space.
  - Name: WorldToScreenPoint
    Returns:
      - Name: Vector2
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector3
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from world space into screen space.
  - Name: ScreenToViewportPoint
    Returns:
      - Name: Vector2
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from screen space into viewport space.
  - Name: ScreenToWorldPoint
    Returns:
      - Name: Vector3
        IsOptional: false
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: pos
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Transforms `pos` from screen space into world space.
  - Name: New
    Returns:
      - Name: Camera
        IsOptional: false
    Parameters:
      - Type:
          Name: NetworkedObject
          IsOptional: true
        Name: parent
        DefaultValue: null
    IsAsync: false
    IsStatic: true
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Missing Documentation
Events:
  - Name: FirstPersonEntered
    Parameters: []
    Description: Fires when camera has entered first person
  - Name: FirstPersonExited
    Parameters: []
    Description: Fires when camera has exited first person
IsStatic: false
IsAbstract: false
IsInstantiable: true
StaticAlias: null
