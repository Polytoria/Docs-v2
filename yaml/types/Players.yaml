Name: Players
Description: Players is the container class for all Player instances.
Category: game
BaseType: Instance
Properties:
  - Name: LocalPlayer
    Type:
      Name: Player
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The player who is currently playing the game.
  - Name: PlayerCollisionEnabled
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not collisions between players are enabled.
  - Name: UseServerAuthority
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not server should trust the client for
      adjusting player's properties. Enabling this is recommended.
  - Name: PlayersCount
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: The number of players currently in the game.
Methods:
  - Name: GetPlayers
    Returns:
      - ElementType:
          Name: Player
          IsOptional: false
        Name: Array
        IsOptional: false
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns a table containing all the players currently in the game.
  - Name: GetPlayer
    Returns:
      - Name: Player
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: username
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the player with the specified username.
  - Name: GetPlayerByID
    Returns:
      - Name: Player
        IsOptional: false
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: userID
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the player with the specified user ID.
Events:
  - Name: PlayerAdded
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
    Description: Fires when player has connected
  - Name: PlayerRemoved
    Parameters:
      - Type:
          Name: Player
          IsOptional: false
        Name: player
        DefaultValue: null
    Description: Fires when player has disconnected
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Players
