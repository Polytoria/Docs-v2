Name: CoreUIService
Description: CoreUI is a static class that allows for the toggling of certain core GUI.
Category: services
BaseType: Instance
Properties:
  - Name: TopInset
    Type: number
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsObsolete: false
    IsStatic: true
    Description: Determines the top inset of the UI.
  - Name: CtrlLockCursor
    Type: CtrlLockCursor
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines what cursor is used when the player is ctrl-locked.
  - Name: ChatBubbleRenderDistance
    Type: number
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines the maximum distance at which chat bubbles are rendered.
  - Name: UseUserCard
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the user card (in the upper right hand
      corner above the leaderboard) is visible.
  - Name: UseChat
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the chat box is visible.
  - Name: UseHealthBar
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the player's health bar is visible.
  - Name: UseLeaderboard
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the player list/leaderboard is visible.
  - Name: UseHotbar
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the hot bar is visible.
  - Name: UseBackpack
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the backpack is togglable.
  - Name: UseMenuButton
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the menu button is visible.
  - Name: UseEmoteWheel
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the emote wheel is visible.
  - Name: CanRespawn
    Type: boolean
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsObsolete: false
    IsStatic: false
    Description: Determines whether or not the player can respawn.
Methods: []
Events: []
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: CoreUI
