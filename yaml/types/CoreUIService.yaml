Name: CoreUIService
Description: CoreUI is a static class that allows for the toggling of certain core GUI.
Category: services
BaseType: Instance
Properties:
  - Name: TopInset
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: true
    ObsoletionInfo: null
    Description: Determines the top inset of the UI.
  - Name: CtrlLockCursor
    Type:
      Name: CtrlLockCursor
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines what cursor is used when the player is ctrl-locked.
  - Name: ChatBubbleRenderDistance
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines the maximum distance at which chat bubbles are rendered.
  - Name: UseUserCard
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the user card (in the upper right hand
      corner above the leaderboard) is visible.
  - Name: UseChat
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the chat box is visible.
  - Name: UseHealthBar
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the player's health bar is visible.
  - Name: UseLeaderboard
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the player list/leaderboard is visible.
  - Name: UseHotbar
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the hot bar is visible.
  - Name: UseBackpack
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the backpack is togglable.
  - Name: UseMenuButton
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the menu button is visible.
  - Name: UseEmoteWheel
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the emote wheel is visible.
  - Name: CanRespawn
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether or not the player can respawn.
Methods: []
Events: []
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: CoreUI
