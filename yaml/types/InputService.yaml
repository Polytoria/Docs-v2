Name: InputService
Description: InputService is a class used for retrieving user input data, such
  as the mouse and keyboard.
Category: services
BaseType: Instance
Properties:
  - Name: IsWindowFocused
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the game window is currently focused.
  - Name: IsTouchscreen
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the input device is a touchscreen.
  - Name: IsGameFocused
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the game is currently focused.
  - Name: IsInputFocused
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether an input is currently focused.
  - Name: IsGamepadConnected
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether a gamepad is currently connected.
  - Name: IsMenuOpened
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates whether the game menu is currently opened.
  - Name: CursorLocked
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the cursor is currently locked.
  - Name: CursorVisible
    Type:
      Name: boolean
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: false
    IsStatic: false
    ObsoletionInfo: null
    Description: Determines whether the cursor is currently visible.
  - Name: MouseDelta
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Change in mouse position since the last frame.
  - Name: MousePosition
    Type:
      Name: Vector2
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the current position of the mouse cursor.
  - Name: ScreenWidth
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the width of the screen.
  - Name: ScreenHeight
    Type:
      Name: number
      IsOptional: false
    IsAccessibleByScripts: true
    IsReadOnly: true
    IsStatic: false
    ObsoletionInfo: null
    Description: Indicates the height of the screen.
Methods:
  - Name: StartGamepadVibration
    Returns: []
    Parameters:
      - Type:
          Name: number
          IsOptional: false
        Name: weakMagnitude
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: strongMagnitude
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: duration
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Vibrates the gamepad
  - Name: StopGamepadVibration
    Returns: []
    Parameters: []
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Stops vibrating the gamepad
  - Name: GetMouseWorldPosition
    Returns:
      - Name: Vector3
        IsOptional: false
    Parameters:
      - Type:
          ElementType:
            Name: Instance
            IsOptional: false
          Name: Array
          IsOptional: true
        Name: ignoreList
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: true
        Name: passthroughMask
        DefaultValue: "1"
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the 3D world-space position corresponding to the current
      mouse cursor location.
  - Name: GetVector2
    Returns:
      - Name: InputActionVector2
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: actionName
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the current Vector2 value of the action.
  - Name: GetButton
    Returns:
      - Name: InputActionButton
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: actionName
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns true if the specified button is being held down.
  - Name: GetAxis
    Returns:
      - Name: InputActionAxis
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: actionName
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Returns the value of the specified axis.
  - Name: BindButton
    Returns:
      - Name: InputActionButton
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: name
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Bind a new Button Input Action
  - Name: BindAxis
    Returns:
      - Name: InputActionAxis
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: name
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Bind new Axis Input Action
  - Name: BindVector2
    Returns:
      - Name: InputActionVector2
        IsOptional: false
    Parameters:
      - Type:
          Name: string
          IsOptional: false
        Name: name
        DefaultValue: null
    IsAsync: false
    IsStatic: false
    IsSemiStatic: false
    ObsoletionInfo: null
    Description: Bind new Vector2 Input Action
Events:
  - Name: MouseMoved
    Parameters:
      - Type:
          Name: Vector2
          IsOptional: false
        Name: mouseDelta
        DefaultValue: null
    Description: Fires when the mouse is moved
  - Name: GameFocused
    Parameters: []
    Description: Fires when the game has been focused
  - Name: GameUnfocused
    Parameters: []
    Description: Fires when the game has been unfocused
  - Name: GamepadConnected
    Parameters: []
    Description: Fires when gamepad is connected
  - Name: GamepadDisconnected
    Parameters: []
    Description: Fires when gamepad has been disconnected
  - Name: KeyDown
    Parameters:
      - Type:
          Name: KeyCode
          IsOptional: false
        Name: keycode
        DefaultValue: null
      - Type:
          Name: boolean
          IsOptional: false
        Name: gameFocused
        DefaultValue: null
    Description: Fires when key has been pressed
  - Name: KeyUp
    Parameters:
      - Type:
          Name: KeyCode
          IsOptional: false
        Name: keycode
        DefaultValue: null
      - Type:
          Name: boolean
          IsOptional: false
        Name: gameFocused
        DefaultValue: null
    Description: Fires when key has been released
  - Name: AxisValueChanged
    Parameters:
      - Type:
          Name: KeyCode
          IsOptional: false
        Name: keycode
        DefaultValue: null
      - Type:
          Name: number
          IsOptional: false
        Name: value
        DefaultValue: null
    Description: Fires when analog input has been changed
IsStatic: true
IsAbstract: false
IsInstantiable: false
StaticAlias: Input
